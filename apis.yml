name: Native Security
description: >-
  Native Security is a cloud security control plane that unifies security
  posture and enforcement across AWS, Azure, Google Cloud, and OCI. The
  platform translates security intent expressed in natural language into
  enforceable architectural controls, shifting teams from reactive detection
  toward proactive, secure-by-design defense using built-in cloud security
  primitives. Capabilities include multi-cloud policy enforcement from a single
  definition, automated organization topology discovery and mapping,
  architectural segmentation and perimeter enforcement, AI-agent guardrails
  through architectural boundaries, and compliance automation with audit
  readiness. Native Security is backed by General Catalyst. As of this profile
  the company exposes no public developer API, SDK, or OpenAPI surface; product
  documentation and the application console sit behind authentication.
